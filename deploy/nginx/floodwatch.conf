# =============================================================================
# Pampanga Flood Watch — nginx origin configuration
#
# Topology: visitor -> Cloudflare (TLS #1, browser-trusted cert)
#                   -> nginx on this box (TLS #2, Cloudflare Origin CA cert)
#                   -> 127.0.0.1:3000 (Next.js + Socket.io, one process)
#
# Install:
#   sudo cp floodwatch.conf /etc/nginx/sites-available/floodwatch
#   sudo ln -sfn /etc/nginx/sites-available/floodwatch /etc/nginx/sites-enabled/floodwatch
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before it will load, two files must exist (see deploy/nginx/README.md):
#   /etc/ssl/cloudflare/floodwatch.pem
#   /etc/ssl/cloudflare/floodwatch.key
#
# Replace floodwatch.example.ph everywhere, including the redirect on line ~70.
#
# This file is included from inside nginx.conf's http{} block, which is what
# makes the map and set_real_ip_from directives below legal here. Keep it as a
# single file: adding a second copy of these maps under conf.d/ makes nginx
# fail to start with "duplicate map".
# =============================================================================


# ---- maps -------------------------------------------------------------------

# Echo the client's Upgrade header back to the upstream; send "close" for
# ordinary requests so they are never mislabelled as an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare tells the origin what scheme the visitor used. Fall back to our own
# scheme when the header is absent, so this stays correct if a request ever
# arrives without going through Cloudflare. This is also what keeps the config
# honest under Cloudflare's "Flexible" mode, where the origin hop is plain HTTP
# even though the visitor is on HTTPS.
map $http_x_forwarded_proto $fw_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}


# ---- restore the visitor's real IP ------------------------------------------
#
# Behind Cloudflare every connection arrives from an edge address, so without
# this $remote_addr is Cloudflare: access logs are useless, rate limiting keys
# on the wrong address, and fail2ban bans Cloudflare instead of the attacker.
#
# CF-Connecting-IP is trusted ONLY from the ranges below, so it cannot be forged
# by anyone who reaches the origin directly.
#
# If you ever stop using Cloudflare, DELETE this block. With no Cloudflare in
# front, CF-Connecting-IP is an attacker-controlled header and trusting it lets
# anyone forge their address in your logs.

# >>> cloudflare-ips  (generated 2026-08-30 — refresh with ./refresh-cloudflare-ips.sh)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# <<< cloudflare-ips

real_ip_header CF-Connecting-IP;


# ---- port 80: safety net only -----------------------------------------------
#
# With Cloudflare in Full (strict) the edge only ever connects on 443, and the
# security group should not expose 80 at all. This block exists for the day
# someone opens it.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://floodwatch.example.ph$request_uri;
}


# ---- the site ---------------------------------------------------------------

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name floodwatch.example.ph;

    # Cloudflare Origin CA certificate: 15 years, no renewal job, no ACME
    # challenge. NOT browser-trusted — only Cloudflare accepts it, which is the
    # point. Grey-cloud the DNS record and visitors get a certificate warning.
    ssl_certificate     /etc/ssl/cloudflare/floodwatch.pem;
    ssl_certificate_key /etc/ssl/cloudflare/floodwatch.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls — refuse any TLS client that is not Cloudflare,
    # so a leaked origin IP cannot be hit directly even if the firewall lapses.
    # Enable the toggle in the Cloudflare dashboard BEFORE reloading nginx, or
    # the edge's next request is refused and the site goes down.
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    access_log /var/log/nginx/floodwatch.access.log;
    error_log  /var/log/nginx/floodwatch.error.log;

    # POST /api/uploads refuses any body over PHOTO_MAX_BYTES + 64 KiB =
    # 5,308,416 bytes. Sit above that so the app answers with its own 422 JSON
    # instead of nginx returning a 413 HTML page, and below the 10 MiB limit at
    # which Next truncates the body it clones for proxy.ts. nginx's default is
    # 1m, which would 413 every single photo.
    client_max_body_size 8m;
    client_body_timeout  60s;

    # Cloudflare compresses at the edge; this only shrinks the origin->edge hop.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ---- Socket.io ----------------------------------------------------------
    # server.ts attaches engine.io to the same HTTP listener at SOCKET_PATH
    # ("/ws"). engine.io claims that path by prefix, and this location mirrors
    # it. Never add an App Router route under /ws.
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fw_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # A flood-watch socket is idle by design. nginx's 60s default kills it
        # the moment anything perturbs Socket.io's 25s heartbeat, and the
        # symptom is "the live feed flickers every minute" with no error.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Do not sit on engine.io's long-poll responses.
        proxy_buffering off;
    }

    # ---- everything else ----------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Also here, so realtime survives if NEXT_PUBLIC_SOCKET_PATH is ever
        # changed and the /ws block above stops matching.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fw_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
